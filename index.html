<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PricePak — 1M+ Product Price Comparison</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1120;
            color: #f1f5f9;
            padding: 15px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            max-width: 800px;
            margin: 0 auto;
        }

        header h1 {
            color: #38bdf8;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .search-box {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: #38bdf8;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: #1e293b;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #0f172a;
            margin-bottom: 12px;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fff;
        }

        .price-row {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.88rem;
            margin-bottom: 8px;
        }

        .cheap {
            background-color: rgba(34, 197, 94, 0.12);
            border-left: 3px solid #22c55e;
            color: #4ade80;
        }

        .expensive {
            background-color: rgba(239, 68, 68, 0.12);
            border-left: 3px solid #ef4444;
            color: #f87171;
        }

        .price-row strong {
            display: block;
            font-size: 1rem;
            color: #fff;
        }

        .address {
            font-size: 0.78rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
        }

        .pagination button {
            padding: 8px 16px;
            background-color: #38bdf8;
            border: none;
            color: #0f172a;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>PricePak</h1>
        <p>10 Lakh+ Products ki Qeemat ka Muqabla</p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search product name..." onkeyup="searchProduct()">
        </div>
    </header>

    <div class="container" id="productGrid">
        </div>

    <div class="pagination">
        <button onclick="prevPage()">Previous</button>
        <button onclick="nextPage()">Next</button>
    </div>

    <script>
        // Sample Data Structure (یہاں API یا Database کا ڈیٹا آئے گا)
        const products = [
            {
                title: "Mobile Phone Model X",
                img: "https://via.placeholder.com/300x160",
                cheapPrice: "Rs. 45,000",
                cheapAddr: "Hall Road, Lahore",
                expPrice: "Rs. 52,000",
                expAddr: "Shopping Mall, Karachi"
            },
            {
                title: "Grocery Cooking Oil 5L",
                img: "https://via.placeholder.com/300x160",
                cheapPrice: "Rs. 2,400",
                cheapAddr: "Wholesale Market, Rawalpindi",
                expPrice: "Rs. 2,850",
                expAddr: "Super Market, Islamabad"
            }
        ];

        function renderProducts(data) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            data.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" alt="${p.title}" class="product-image">
                        <div class="product-title">${p.title}</div>
                        
                        <div class="price-row cheap">
                            Sasti Qeemat: <strong>${p.cheapPrice}</strong>
                            <div class="address">📍 ${p.cheapAddr}</div>
                        </div>

                        <div class="price-row expensive">
                            Mehangi Qeemat: <strong>${p.expPrice}</strong>
                            <div class="address">📍 ${p.expAddr}</div>
                        </div>
                    </div>
                `;
            });
        }

        function searchProduct() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let filtered = products.filter(p => p.title.toLowerCase().includes(input));
            renderProducts(filtered);
        }

        // Initial Render
        renderProducts(products);
    </script>
</body>
</html>
