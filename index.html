<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PakPrice — Created by Mahad</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fb;
    color:#111827;
}

header{
    background:#0f172a;
    color:white;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:29px;
    font-weight:bold;
}

.logo span{
    color:#22c55e;
}

.creator{
    margin-top:4px;
    color:#cbd5e1;
    font-size:13px;
}

.search-box{
    background:white;
    padding:20px 6%;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.search{
    max-width:850px;
    margin:auto;
    display:flex;
    gap:10px;
}

.search input{
    flex:1;
    padding:15px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.search button{
    border:0;
    background:#16a34a;
    color:white;
    padding:0 24px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

.categories{
    padding:20px 6%;
    display:flex;
    gap:10px;
    overflow-x:auto;
}

.category{
    background:white;
    border:1px solid #e5e7eb;
    padding:10px 17px;
    border-radius:20px;
    white-space:nowrap;
    cursor:pointer;
}

.category:hover,
.category.active{
    background:#16a34a;
    color:white;
}

.hero{
    margin:10px 6% 25px;
    padding:35px;
    border-radius:18px;
    background:linear-gradient(135deg,#0f172a,#166534);
    color:white;
}

.hero h1{
    font-size:34px;
    margin-bottom:10px;
}

.hero p{
    color:#d1fae5;
}

.stats{
    padding:0 6% 25px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.stat h2{
    color:#16a34a;
    margin-bottom:5px;
}

.products{
    padding:0 6% 40px;
}

.products h2{
    margin-bottom:18px;
}

#status{
    margin-bottom:15px;
    color:#64748b;
    font-size:14px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
}

.card img{
    width:100%;
    height:190px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.card h3{
    font-size:17px;
    margin-bottom:8px;
}

.price{
    color:#16a34a;
    font-size:22px;
    font-weight:bold;
}

.shop{
    margin-top:10px;
    color:#64748b;
    font-size:13px;
}

footer{
    background:#0f172a;
    color:#cbd5e1;
    text-align:center;
    padding:25px;
}

footer strong{
    color:white;
}

@media(max-width:600px){

    .hero h1{
        font-size:27px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .search button{
        padding:0 16px;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <div class="logo">Pak<span>Price</span></div>
        <div class="creator">Created by Mahad</div>
    </div>
</header>

<div class="search-box">
    <div class="search">
        <input
            id="searchInput"
            type="text"
            placeholder="Search products..."
        >
        <button onclick="searchProducts()">Search</button>
    </div>
</div>

<div class="categories" id="categories"></div>

<section class="hero">
    <h1>Find Better Prices in Pakistan 🇵🇰</h1>
    <p>Search and compare products from our growing price database.</p>
</section>

<section class="stats">

    <div class="stat">
        <h2>10M+</h2>
        <p>Target Products</p>
    </div>

    <div class="stat">
        <h2>AI</h2>
        <p>Smart Price Updates</p>
    </div>

    <div class="stat">
        <h2>24/7</h2>
        <p>Price Monitoring</p>
    </div>

</section>

<section class="products">

    <h2>Products</h2>

    <div id="status">Loading products...</div>

    <div id="productGrid" class="grid"></div>

</section>

<footer>
    <p><strong>PakPrice</strong> — Pakistan Price Comparison</p>
    <p>Created by Mahad © 2026</p>
</footer>


<script>

let products = [];
let currentCategory = "All";
